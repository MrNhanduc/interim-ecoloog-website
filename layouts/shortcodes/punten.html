{{- /*
  Rooster voor korte punten naast elkaar. Op desktop twee kolommen,
  op smalle schermen vallen ze onder elkaar. Met kolommen="4" staan ze
  op brede schermen met vier naast elkaar.

    {{< punten >}}
    {{< punt titel="Kwaliteit" >}}Tekst...{{< /punt >}}
    {{< /punten >}}
*/ -}}
<div class="punten{{ with .Get "kolommen" }} punten--{{ . }}{{ end }}">
  {{ .Inner }}
</div>
