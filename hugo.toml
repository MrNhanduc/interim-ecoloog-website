baseURL = "https://MrNhanduc.github.io/interim-ecoloog-website/"
languageCode = "nl-nl"
defaultContentLanguage = "nl"
title = "De Interim Ecoloog"
theme = "congo"
enableRobotsTXT = true

# Congo levert zelf een Engelse taalconfiguratie mee; die zetten we uit,
# anders bouwt Hugo de site twee keer (/en/ en /nl/).
disableLanguages = ["en"]

[languages]
  [languages.nl]
    locale = "nl-NL"
    label = "Nederlands"
    direction = "ltr"
    weight = 1
    title = "De Interim Ecoloog"
    [languages.nl.params]
      dateFormat = "2 January 2006"

# Het contactformulier staat als HTML in content/contact/_index.md.
# Zonder deze instelling gooit Hugo die HTML weg bij het renderen.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ------------------------------------------------------------------
# LET OP: pas baseURL hierboven aan naar jouw eigen domeinnaam
# ------------------------------------------------------------------

[params]
  colorScheme = "custom"          # assets/css/schemes/custom.css
  defaultAppearance = "light"     # site start in lichte modus
  autoSwitchAppearance = false    # geen automatische donkere modus
  defaultThemeColor = "#FAF7EF"   # crème, kleurt de browserbalk op mobiel

  # ------------------------------------------------------------------
  # ZOEKMACHINES — de site is nog in aanbouw.
  # Deze regel zet in elke pagina een noindex-instructie en laat
  # layouts/robots.txt alle zoekmachines weren.
  #
  # LET OP: HAAL DEZE REGEL WEG VOORDAT DE SITE ECHT LIVE GAAT.
  # Blijft hij staan, dan blijft de site onvindbaar in Google.
  # ------------------------------------------------------------------
  robots = "noindex, nofollow"

  description = "Voor al uw ecologische vraagstukken — quickscans, ecologisch onderzoek, ontheffingen en interim diensten."

  [params.header]
    layout = "hybrid"       # hamburgermenu op mobiel, gewone balk op desktop
    logo = "img/logo.png"         # staat in assets/img/
    showTitle = false             # het logo bevat de naam al

  [params.article]
    # Zet het hekje uit dat bij het zweven over een kop verschijnt. De
    # koppen houden hun id, dus rechtstreeks naar een kop linken
    # (bijvoorbeeld /werkvelden/#quickscan) blijft gewoon werken.
    showHeadingAnchors = false

  [params.author]
    name = "Pim Godschalk"

  [params.footer]
    showThemeAttribution = false
    showAppearanceSwitcher = false
    # De copyrightregel van het thema staat uit: die staat nu samen met de
    # fotocredit en de link naar de privacyverklaring op één regel in
    # layouts/_partials/extend-footer.html. Dat moet daar, want alleen daar
    # kan Hugo het adres van de privacypagina invullen.
    showCopyright = false

[menu]
  [[menu.main]]
    name = "Werkvelden"
    pageRef = "/werkvelden"
    weight = 1
  [[menu.main]]
    name = "Interim diensten"
    pageRef = "/interim-diensten"
    weight = 2
  [[menu.main]]
    name = "Over"
    pageRef = "/over"
    weight = 3
  [[menu.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 4

[outputs]
  # "robots" moet hier expliciet bij staan: deze regel overschrijft de
  # instelling van het thema, en zonder "robots" wordt layouts/robots.txt
  # niet gegenereerd. Let op de schrijfwijze: in Hugo 0.160 heet dit
  # uitvoerformaat "robots", niet "RobotsTXT" (dat is de oude naam en
  # geeft een foutmelding bij het bouwen).
  home = ["HTML", "robots"]
