# Bouwt de Hugo-site en publiceert hem op GitHub Pages.
# Draait automatisch bij elke push naar main, en kan handmatig gestart
# worden via het tabblad Actions in GitHub.

name: Site bouwen en publiceren

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk. Een lopende publicatie wordt niet afgebroken,
# zodat een halve site nooit live komt te staan.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Bouwen
    runs-on: ubuntu-latest
    env:
      # Congo v2.14 draait niet op oudere Hugo-versies; hou deze bij de tijd.
      HUGO_VERSION: 0.160.0
    steps:
      - name: Hugo installeren (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          # Nodig: het Congo-thema zit als submodule in themes/congo.
          submodules: recursive
          fetch-depth: 0

      - name: Pages configureren
        id: pages
        uses: actions/configure-pages@v5

      - name: Site bouwen
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # De baseURL komt van GitHub zelf. Daardoor klopt hij zowel op
        # gebruikersnaam.github.io/repo/ als straks op een eigen domein,
        # zonder dat hugo.toml aangepast hoeft te worden.
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Resultaat klaarzetten
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Publiceren
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
